name: Build GTA III Ambient Radio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-win32:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Plugin-SDK (October 25, 2025)
        uses: actions/checkout@v4
        with:
          repository: DK22Pac/plugin-sdk
          ref: 624a6a49265fd7a6fc63bda1611013ceabeacb8a
          path: _deps/plugin-sdk
          submodules: recursive
      - uses: microsoft/setup-msbuild@v2
      - name: Fast source regression checks (before SDK compilation)
        shell: pwsh
        run: |
          python -m py_compile tests/verify_source.py
          python tests/verify_source.py
      - name: Run vehicle assignment and ADF regression tests
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x86
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /W4 /Fe:radio-test.exe tests\test_radio.cpp
          if errorlevel 1 exit /b 1
          radio-test.exe
          if errorlevel 1 exit /b 1
      - name: Build Plugin-SDK for GTA III (Win32 Release)
        shell: cmd
        env:
          PLUGIN_SDK_DIR: ${{ github.workspace }}\_deps\plugin-sdk
        run: |
          cd /d "%PLUGIN_SDK_DIR%"
          call "tools\generate\Visual Studio.bat"
          if errorlevel 1 exit /b 1
          msbuild plugin.sln /m /t:plugin_iii /p:Configuration=Release /p:Platform="Mixed Platforms" /v:minimal
          if errorlevel 1 exit /b 1
      - name: Build III.AmbientRadio.asi (Win32 Release)
        shell: cmd
        env:
          PLUGIN_SDK_DIR: ${{ github.workspace }}\_deps\plugin-sdk
        run: |
          msbuild IIIAmbientRadioEXP.vcxproj /m /p:Configuration="Release GTA3" /p:Platform=Win32 /v:minimal
          if errorlevel 1 exit /b 1
      - name: Run source regression checks
        shell: pwsh
        run: python tests/verify_source.py
      - name: Package ASI and BASS runtime
        shell: pwsh
        env:
          PLUGIN_SDK_DIR: ${{ github.workspace }}\_deps\plugin-sdk
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item 'bin/GTA3/Release/III.AmbientRadio.asi' package/
          Copy-Item "$env:PLUGIN_SDK_DIR\shared\bass\bass.dll" package/
          Copy-Item README.md package/
          Compress-Archive -Path package/* -DestinationPath III.AmbientRadio-Win32.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: III.AmbientRadio-Win32
          path: III.AmbientRadio-Win32.zip
          if-no-files-found: error
          retention-days: 30
